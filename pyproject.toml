[project]
name = "Kelly"
version = "0.6.0"
description = "Information theoretic betsize optimization for horse race betting"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kk", email = "kari.kalliojarvi@kolumbus.fi" }]
keywords = ["Kelly"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.15",
    "more-itertools>=11.1",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "requests>=2.34",
    "lxml>=6.1",
    "numpy>=2.5",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/kjkalliojarvi/Kelly"

[project.scripts]
kelly = "Kelly.__main__:kelly"

[dependency-groups]
dev = [
    "flake8>=7.0",
    "coverage>=7.4",
    "pytest>=8.1",
    "watchdog>=2.3",
    "tox>=4.14",
    "wheel>=0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Kelly"]
